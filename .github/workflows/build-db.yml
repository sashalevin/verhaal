name: Build verhaal database

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
  push:
    branches: [github]
    paths: ['.github/workflows/build-db.yml']

jobs:
  build-db:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout verhaal
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libgit2-dev \
            libsqlite3-dev \
            libpcre2-dev

      - name: Build verhaal
        run: ./autogen.sh

      - name: Clone linux-stable
        run: |
          git clone --bare \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "$RUNNER_TEMP/linux-stable.git"

      - name: Generate verhaal.db
        env:
          CVEKERNELTREE: ${{ runner.temp }}/linux-stable.git
        run: ./build/verhaal

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: verhaal-db
          path: verhaal.db
          if-no-files-found: error
          retention-days: 7
