name: Build verhaal database

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
  push:
    branches: [github]
    paths: ['.github/workflows/build-db.yml']

jobs:
  build-db:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # needed to publish the rolling release

    steps:
      - name: Checkout verhaal
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libgit2-dev \
            libsqlite3-dev \
            libpcre2-dev \
            sqlite3

      - name: Build verhaal
        run: ./autogen.sh

      - name: Clone linux-stable
        run: |
          git clone --bare \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "$RUNNER_TEMP/linux-stable.git"

      - name: Generate verhaal.db
        env:
          CVEKERNELTREE: ${{ runner.temp }}/linux-stable.git
        run: ./build/verhaal

      - name: Compress database with xz
        run: |
          set -euo pipefail
          # Capture metadata before xz consumes verhaal.db.
          {
            echo "DB_COMMITS=$(sqlite3 verhaal.db 'SELECT COUNT(*) FROM commits;')"
            echo "DB_RELEASES=$(sqlite3 verhaal.db 'SELECT COUNT(DISTINCT release) FROM commits;')"
            echo "DB_RAW_SIZE=$(du -h verhaal.db | cut -f1)"
          } >> "$GITHUB_ENV"
          xz -ee -T0 -vv verhaal.db
          echo "DB_XZ_SIZE=$(du -h verhaal.db.xz | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: verhaal-db
          path: verhaal.db.xz
          if-no-files-found: error
          retention-days: 7

      - name: Publish to rolling 'db-latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          built_at=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          notes=$(cat <<EOF
          Daily-rebuilt verhaal database (xz-compressed).

          - Built: \`$built_at\` (run [\`${GITHUB_RUN_ID}\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))
          - Commits: ${DB_COMMITS}
          - Releases tracked: ${DB_RELEASES}
          - Size: ${DB_XZ_SIZE} compressed / ${DB_RAW_SIZE} uncompressed
          - Source: \`linux-stable.git\` from kernel.org

          Decompress with \`xz -d verhaal.db.xz\`.

          This release is overwritten on each daily build.

          **Stable download URL:** https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/verhaal.db.xz
          EOF
          )

          # Drop the previous release (and its tag) so publishedAt reflects
          # this build, not the first-ever publish. Tolerate a missing release
          # so the very first run still works.
          gh release delete db-latest \
            --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          gh release create db-latest verhaal.db.xz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest verhaal.db" \
            --notes "$notes" \
            --latest
